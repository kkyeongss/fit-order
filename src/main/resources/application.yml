spring:
  application:
    name: fit-order
  config:
    # 로컬 비밀값(.env, 커밋 안 됨). 서버에서는 환경변수로 넣는다.
    import: optional:file:.env[.properties]
  datasource:
    url: ${FITORDER_DB_URL:jdbc:postgresql://localhost:5432/fitorder}
    username: ${FITORDER_DB_USER:fitorder}
    password: ${FITORDER_DB_PASSWORD:fitorder}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

fitorder:
  demo:
    # 공개 시연 서버 보호: 켜면 관리자 기능 중 데이터·설정·계정 변경을 막고, 방문자가 넣은 단가·재고·발주안은 매일 새벽 4시에 지운다.
    enabled: ${FITORDER_DEMO:false}
  metrics:
    # 시작할 때 지표를 다시 계산한다. 계산식이 그대로인 배포(화면만 바뀜 등)에서만 false로 건너뛴다.
    recalculate-on-start: ${FITORDER_METRICS_RECALC_ON_START:true}
  security:
    # 시연 계정. 운영 시에는 환경변수로 비밀번호를 바꾼다.
    users:
      - username: user
        password: ${FITORDER_USER_PASSWORD:user1234}
        role: USER
      - username: admin
        password: ${FITORDER_ADMIN_PASSWORD:admin1234}
        role: ADMIN

  external:
    data-go-kr:
      service-key: ${DATA_GO_KR_SERVICE_KEY:}

  # 원천 데이터별 읽기 설정. 내년에 CSV 컬럼명이 바뀌면 오른쪽 값만 고친다.
  # 왼쪽(표준 필드명)은 코드가 쓰는 이름이라 바꾸지 않는다.
  ingestion:
    sources:
      uniform-order:
        name: 근무복 주문현황
        charset: CP949
        columns:
          order-date: 주문일
          order-status: 주문상태
          season: 계절구분
          item: 피복종류
          size: 사이즈
          quantity: 수량
      uniform-order-info:
        name: 근무복 주문현황정보
        charset: CP949
        columns:
          item-code: 근무복코드
          item: 근무복명
          size: 사이즈
          gender-code: 성별코드
          order-date: 사용날짜
          quantity: 주문수량
      # 정원현황: 공공데이터포털 Open API. 망분리 환경에서는 method를 UPLOAD로 바꾸고 CSV를 올린다.
      # 기준일자·부서명 외의 컬럼(임원수, 일반직1급 … 지원직)은 모두 직군·직급별 정원으로 읽는다.
      headcount:
        name: 정원현황
        method: API
        url: https://api.odcloud.kr/api/15144222/v1/uddi:2a23b2a5-027c-43b3-9eb7-c0d983d5ed56
        charset: CP949
        columns:
          base-date: 기준일자
          department: 부서명

  uniform:
    # 품목 분류 규칙. 코드 규칙을 먼저 보고, 없으면 품목명 키워드를 위에서부터 본다.
    # item을 지정하면 그 이름으로 합치고, 비우면 원본 품목명을 그대로 쓴다.
    code-rules:
      - source: uniform-order-info
        code: "10"
        item: 점퍼
        group: JUMPER
      - source: uniform-order-info
        code: "11"
        item: 점퍼
        group: JUMPER
    item-rules:
      - keyword: 패딩
        group: PADDING_VEST
      - keyword: 조끼
        group: VEST
      - keyword: 재킷
        group: JACKET
      - keyword: 자켓
        group: JACKET
      - keyword: 점퍼
        item: 점퍼
        group: JUMPER
      - keyword: 바지
        group: PANTS
      - keyword: 셔츠
        group: SHIRT
    # 뜻을 확인하지 못한 사이즈 코드. 적재는 하되 품질 플래그를 단다.
    unknown-sizes:
      uniform-order-info: ["91", "95"]

    # 지표·추천 계수. 근거는 기획서 '분석·추천 로직'.
    analysis:
      stable-from-year: 2020        # 두 출처가 모두 쌓인 첫 해. 연평균·사이즈 비교 구간의 시작
      per-capita-from-year: 2021    # 이전 정원은 지원직·계약직 미포함
      improvement-rate: 0.5         # 추천으로 줄이는 미스매치 비율
      small-order-max: 10           # 하루 주문량이 이 이하면 소량 발주
      window-years: 3               # 사이즈 비율 비교 구간(최근 3년 vs 그 전 3년)
      average-years: 2              # 추천 총량: 직전 N년 평균
      size-weights: [3, 2, 1]       # 사이즈 배분 가중치, 최근 연도부터
      biennial-groups: [JACKET, PADDING_VEST]   # 격년 주문: 2년 전 값을 쓴다
      default-safety-stock: 0.05
      safety-stock:                 # 백테스트 2022~2025 추천 총량 오차 40% 이상 품목군 (재킷 43%, 바지 68%, 패딩조끼 99%)
        JACKET: 0.10
        PANTS: 0.10
        PADDING_VEST: 0.10
      order-months: [4, 8]          # 정기 발주 시기 제안
      default-unit-price: 53000     # 단가 미입력 품목의 추정 단가(원)
      backtest-from-year: 2022
      backtest-to-year: 2025

    # 조달청 나라장터 쇼핑몰 근무복 시장가(공공데이터포털 15129471). 인증키는 DATA_GO_KR_SERVICE_KEY를 같이 쓴다.
    # 쇼핑몰에서는 셔츠·바지 모두 품명이 '근무복'이고 규격명 설명으로만 구분된다(2026-11 실데이터 423건 확인).
    market-price:
      url: https://apis.data.go.kr/1230000/at/ShoppingMallPrdctInfoService
      operations: [getMASCntrctPrdctInfoList, getUcntrctPrdctInfoList]
      item-name: 근무복
      months: 12                    # API의 등록일시 범위 제한이 1년
      min-samples: 5                # 이보다 적으면 시장가로 안 쓰고 추정 단가 유지
      exclude-keywords: ["상/하", "상하의"]   # 상·하의 한 벌 묶음
      rules:                        # 규격명 설명 키워드 → 품목군. 위에서부터 처음 맞는 규칙
        - {group: PADDING_VEST, keywords: [패딩조끼, 패딩 조끼]}
        - {group: VEST, keywords: [조끼]}
        - {group: JUMPER, keywords: [점퍼, 잠바, 파카, 방한복]}
        - {group: JACKET, keywords: [재킷, 자켓]}
        - {group: PANTS, keywords: [하의, 바지, 슬랙스]}
        - {group: SHIRT, keywords: [셔츠, 하계, 혹서기]}       # 하계·혹서기 상의 = 셔츠형 근무복
        - {group: JACKET, keywords: [동계, 춘추, 추동]}        # 춘추·동계 상의 = 재킷형 근무복

    # 한국환경산업기술원 녹색제품 정보조회 서비스 GW(공공데이터포털 15158379). 오퍼레이션 getServiceList, XML.
    green-product:
      url: https://apis.data.go.kr/B552518/EnvironmentSignalRecognitionInformationInquiryService
      keywords: [근무복, 작업복, 셔츠, 바지, 점퍼, 조끼]   # 제품명 검색(prod_gubn=2)
