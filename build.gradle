plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.fitorder'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.apache.commons:commons-csv:1.14.1'
	implementation 'org.apache.poi:poi-ooxml:5.4.1'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// Colima(Docker Desktop 대신)를 쓰는 Mac에서 Testcontainers가 Docker를 찾도록 한다.
	def colimaSocket = file("${System.getProperty('user.home')}/.colima/default/docker.sock")
	if (!System.getenv('DOCKER_HOST') && colimaSocket.exists()) {
		environment 'DOCKER_HOST', "unix://${colimaSocket}"
		environment 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE', '/var/run/docker.sock'
	}
}

// 화면(React) 빌드: frontend/ → build/frontend → jar의 static/
// -PskipFrontend: 이미 빌드된 build/frontend를 쓴다(Docker 이미지에서 node 단계가 따로 빌드할 때)
def frontendDir = file('frontend')
def frontendOut = layout.buildDirectory.dir('frontend')

tasks.register('frontendBuild', Exec) {
	description = 'React 화면을 빌드한다 (npm ci + npm run build)'
	onlyIf { !project.hasProperty('skipFrontend') }
	workingDir frontendDir
	inputs.files(fileTree(frontendDir) { include 'src/**', 'public/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.ts', 'tsconfig.json' })
	outputs.dir frontendOut
	commandLine 'sh', '-c', 'npm ci --no-audit --no-fund && npm run build'
}

tasks.named('bootJar') {
	dependsOn 'frontendBuild'
	from(frontendOut) {
		into 'BOOT-INF/classes/static'
	}
}
